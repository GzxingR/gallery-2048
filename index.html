<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048 · 华为云 ECS 部署</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141c33; --tile:#1d2742; --text:#e8eefc;
    --a1:#4fc3f7; --a2:#7c5cff; --accent:#ffb648;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2a52 0%,var(--bg) 55%,#070a14 100%);
    color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:16px;gap:14px;overflow:hidden;
  }
  header{width:min(92vw,460px);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:34px;letter-spacing:.06em;font-weight:800;
     background:linear-gradient(92deg,var(--a1),var(--a2) 60%,var(--accent));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11px;opacity:.55;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  .scores{display:flex;gap:8px}
  .score{background:var(--panel);border:1px solid #26325a;border-radius:10px;padding:6px 12px;text-align:center;min-width:74px}
  .score span{display:block;font-size:10px;opacity:.6;letter-spacing:.1em}
  .score b{font-size:19px;font-variant-numeric:tabular-nums}
  .board-wrap{position:relative;width:min(92vw,460px);aspect-ratio:1/1}
  #board{
    position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    background:var(--panel);border:1px solid #26325a;border-radius:16px;padding:10px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03);
    touch-action:none;
  }
  .cell{background:var(--tile);border-radius:10px;display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:clamp(16px,5.2vw,30px);color:#fff;transition:transform .12s ease;
        will-change:transform;user-select:none}
  .v2{background:#2a3550}.v4{background:#31406a}.v8{background:#3f6fa8}
  .v16{background:#4a86c8}.v32{background:#5c9be0}.v64{background:#7c5cff}
  .v128{background:#00b3a4;font-size:clamp(14px,4.4vw,26px)}
  .v256{background:#12a37f;font-size:clamp(14px,4.4vw,26px)}
  .v512{background:#e0a020;font-size:clamp(14px,4.4vw,26px)}
  .v1024{background:#ef7d2f;font-size:clamp(12px,3.6vw,21px)}
  .v2048{background:linear-gradient(135deg,#ffd166,#ff8a3d);color:#1a1105;font-size:clamp(12px,3.6vw,21px);
         box-shadow:0 0 24px rgba(255,171,64,.55)}
  .vbig{background:linear-gradient(135deg,#ff5f6d,#ffc371);color:#26130a;font-size:clamp(11px,3.2vw,18px)}
  .pop{animation:pop .16s ease}
  @keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}
  #overlay{
    position:absolute;inset:0;display:none;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;border-radius:16px;
    background:rgba(8,12,24,.86);backdrop-filter:blur(3px);z-index:5;text-align:center;padding:20px
  }
  #overlay.show{display:flex}
  #overlay h2{margin:0;font-size:26px;letter-spacing:.04em;
     background:linear-gradient(92deg,var(--a1),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  #overlay p{margin:0;opacity:.7;font-size:13px;line-height:1.6}
  button{
    cursor:pointer;border:0;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:700;color:#0a1020;
    background:linear-gradient(135deg,var(--a1),var(--accent));transition:transform .1s
  }
  button:active{transform:scale(.96)}
  footer{font-size:11px;opacity:.42;letter-spacing:.06em;text-align:center;line-height:1.7}
</style>
</head>
<body>
  <header>
    <div>
      <h1>2048</h1>
      <div class="sub">Deployed on HuaweiCloud ECS</div>
    </div>
    <div class="scores">
      <div class="score"><span>SCORE</span><b id="score">0</b></div>
      <div class="score"><span>BEST</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="board-wrap">
    <div id="board"></div>
    <div id="overlay">
      <h2 id="ovTitle">游戏结束</h2>
      <p id="ovText">本局得分 <b id="ovScore">0</b></p>
      <button id="restart">再来一局</button>
    </div>
  </div>

  <footer>方向键 / WASD 操作 · 移动端左右滑动<br/>Nginx 静态托管于华为云 ECS</footer>

<script>
(function () {
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovScore = document.getElementById('ovScore');
  const restartBtn = document.getElementById('restart');

  let grid = [];
  let score = 0;
  let best = Number(localStorage.getItem('best2048') || 0);
  let won = false;
  let dead = false;

  bestEl.textContent = best;

  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cells.push(d);
  }

  const empty = () => {
    const out = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) out.push([r, c]);
    return out;
  };

  function addTile() {
    const spots = empty();
    if (!spots.length) return;
    const [r, c] = spots[Math.floor(Math.random() * spots.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0; won = false; dead = false;
    overlay.classList.remove('show');
    addTile(); addTile();
    render();
  }

  function cls(v) {
    if (!v) return 'cell';
    if (v > 2048) return 'cell vbig';
    return 'cell v' + v;
  }

  function render() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = cells[r * SIZE + c];
        const v = grid[r][c];
        el.className = cls(v);
        el.textContent = v ? v : '';
        if (v) { el.classList.add('pop'); }
      }
    }
    scoreEl.textContent = score;
    if (score > best) { best = score; localStorage.setItem('best2048', best); bestEl.textContent = best; }
  }

  function compress(line) {
    const vals = line.filter((v) => v);
    const out = [];
    let gained = 0;
    for (let i = 0; i < vals.length; i++) {
      if (vals[i] === vals[i + 1]) {
        const merged = vals[i] * 2;
        out.push(merged);
        gained += merged;
        if (merged === 2048) won = true;
        i++;
      } else {
        out.push(vals[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { out, gained };
  }

  function move(dir) {
    if (dead) return;
    let moved = false;
    let gainedTotal = 0;

    const rotate = (g) => g[0].map((_, i) => g.map((row) => row[i]).reverse());

    let g = grid.map((row) => row.slice());
    // normalize so that we always slide left
    const times = { left: 0, up: 1, right: 2, down: 3 }[dir];
    for (let t = 0; t < times; t++) g = rotate(g);

    for (let r = 0; r < SIZE; r++) {
      const before = g[r].slice();
      const { out, gained } = compress(g[r]);
      if (out.some((v, i) => v !== before[i])) moved = true;
      g[r] = out;
      gainedTotal += gained;
    }
    for (let t = 0; t < (4 - times) % 4; t++) g = rotate(g);

    if (!moved) return;
    grid = g;
    score += gainedTotal;
    addTile();
    render();

    if (won) {
      won = false;
      ovTitle.textContent = '2048 达成';
      ovText.innerHTML = '你已经合成 2048！可以继续挑战更高分。';
      overlay.classList.add('show');
      return;
    }
    if (!canMove()) {
      dead = true;
      ovTitle.textContent = '游戏结束';
      ovText.innerHTML = '本局得分 <b>' + score + '</b>';
      overlay.classList.add('show');
    }
  }

  function canMove() {
    if (empty().length) return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    return false;
  }

  const KEYS = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };

  window.addEventListener('keydown', (e) => {
    const dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  }, { passive: false });

  let sx = 0, sy = 0, tracking = false;
  const boardElRect = () => boardEl.getBoundingClientRect();

  boardEl.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive: true });

  boardEl.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  boardEl.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  restartBtn.addEventListener('click', reset);

  window.__newGame2048 = reset;
  reset();
})();
</script>
</body>
</html>
